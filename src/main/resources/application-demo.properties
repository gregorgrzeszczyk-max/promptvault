# ============================================================
# PromptVault: DEMO profile (zero setup, no MySQL required)
# ------------------------------------------------------------
# Runs the whole application against an in-memory H2 database.
# Schema is created automatically and demo data is seeded on
# startup by DataSeeder, so you can log in immediately.
#
# Start it with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=demo
#
# Use this only to try the app quickly. For the graded
# submission, use the default MySQL configuration (see README).
# ============================================================

server.port=8080

# In-memory H2 database, MySQL-compatible mode
spring.datasource.url=jdbc:h2:mem:promptvault;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate: build the schema fresh each run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable the H2 web console at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:promptvault, user: sa, no password)
spring.h2.console.enabled=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session
server.servlet.session.timeout=30m

# Logging
logging.level.com.promptvault=INFO
logging.level.org.springframework.security=WARN
