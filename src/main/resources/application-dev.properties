# ============================================================
# PromptVault Development Profile Overrides
# ============================================================

# Allow Hibernate to update schema automatically during development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable template caching so edits are visible without restart
spring.thymeleaf.cache=false

# Verbose logging for local debugging
logging.level.com.promptvault=DEBUG
logging.level.org.springframework.security=DEBUG
