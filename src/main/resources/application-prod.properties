# ============================================================
# PromptVault Production Profile Overrides
# PVAULT-010 — Disable verbose logging in production
# ============================================================

# Suppress all verbose logging; only WARN and above in production
logging.level.root=WARN
logging.level.com.promptvault=INFO
logging.level.org.springframework.security=WARN

# Never expose SQL in production logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Cache Thymeleaf templates in production
spring.thymeleaf.cache=true

# Validate schema on startup only; do NOT auto-create or update DDL
spring.jpa.hibernate.ddl-auto=validate

# H2 console must never be available in production (PVAULT-P2-05)
spring.h2.console.enabled=false

# ------------------------------------------------------------
# PVAULT-P3-17 — HTTPS enforcement (OWASP A04, CWE-319)
# ------------------------------------------------------------
# In production PromptVault MUST only be reachable over TLS. Either:
#  (a) terminate TLS at a reverse proxy (nginx/ALB) that redirects all HTTP
#      traffic to HTTPS and forwards X-Forwarded-Proto, in which case keep:
server.forward-headers-strategy=framework
#  (b) or serve TLS directly from the embedded server by providing a keystore:
#server.ssl.enabled=true
#server.ssl.key-store=${SSL_KEYSTORE_PATH}
#server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
#server.ssl.key-store-type=PKCS12
# The HSTS header is already emitted by SecurityConfig once HTTPS is active.

# Mark session cookies Secure so they are never sent over plain HTTP
server.servlet.session.cookie.secure=true
