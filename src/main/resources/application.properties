# ============================================
# PromptVault Application Configuration
# ============================================

# Server
server.port=8080

# MySQL Database Configuration
# PVAULT-002: All credentials externalised to environment variables.
# Set DB_URL, DB_USERNAME, and DB_PASSWORD in the host environment or CI/CD
# secrets store. Do NOT commit real values here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/promptvault?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:promptvault_app}
spring.datasource.password=${DB_PASSWORD:CHANGE_ME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# ddl-auto=validate in all non-dev environments (overridden in application-dev.properties)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Session
# PVAULT-P3-14 — Sessions expire after 30 minutes of inactivity (CWE-613)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# PVAULT-P2-05 — H2 console is disabled by default (only the isolated demo
# profile may enable it; never enable in production).
spring.h2.console.enabled=false

# Logging — PVAULT-010: Use INFO as the base level.
# Production logging is further restricted in application-prod.properties.
logging.level.root=INFO
logging.level.com.promptvault=INFO
logging.level.org.springframework.security=WARN
