<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Category</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-container { padding: 15px; border: 1px solid #ccc; max-width: 400px; background-color: #f9f9f9; }
        input { display: block; margin-bottom: 10px; padding: 8px; width: 95%; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
<h1>Edit Prompt Category</h1>

<div class="form-container">
    <form th:action="@{/admin/categories/update}" method="post">

        <input type="hidden" name="id" th:value="${category.id}" />

        <label>Category Name:</label>
        <input type="text" name="name" th:value="${category.name}" required />

        <label>Description:</label>
        <input type="text" name="description" th:value="${category.description}" required />

        <button type="submit" style="background-color: #007bff; color: white; border: none;">Save Changes</button>
        <a href="/admin/categories" style="margin-left: 10px; text-decoration: none;">Cancel</a>
    </form>
</div>
</body>
</html>
