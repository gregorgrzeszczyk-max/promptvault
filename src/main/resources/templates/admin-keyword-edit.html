<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Policy Keyword</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-container { padding: 15px; border: 1px solid #ccc; max-width: 400px; background-color: #f9f9f9; }
        input { display: block; margin-bottom: 10px; padding: 8px; width: 95%; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
<h1>Edit Policy Keyword</h1>

<div th:if="${error}" style="color:#721c24; background:#f8d7da; padding:10px; border-radius:4px; max-width:400px; margin-bottom:12px;" th:text="${error}"></div>

<div class="form-container">
    <form th:action="@{/admin/keywords/update}" method="post">

        <input type="hidden" name="id" th:value="${keyword.id}" />

        <label>Banned Word or Phrase:</label>
        <input type="text" name="word" th:value="${keyword.word}" required />

        <button type="submit" style="background-color: #6c757d; color: white; border: none;">Save Changes</button>
        <a href="/admin/keywords" style="margin-left: 10px; text-decoration: none;">Cancel</a>
    </form>
</div>
</body>
</html>
