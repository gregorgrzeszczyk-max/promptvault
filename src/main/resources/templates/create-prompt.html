<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create a New Prompt</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-container { padding: 20px; border: 1px solid #ccc; max-width: 600px; background-color: #f9f9f9; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], textarea, select { width: 100%; padding: 8px; box-sizing: border-box; }
        textarea { height: 100px; resize: vertical; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
<h1>Add a New Prompt</h1>
<p><a href="/dashboard">Back to Dashboard</a></p>

<div th:if="${error}" style="color:#721c24; background:#f8d7da; padding:10px; border-radius:4px; max-width:600px; margin-bottom:15px;" th:text="${error}"></div>

<div class="form-container">
    <form th:action="@{/user/prompts/save}" method="post">

        <div class="form-group">
            <label>Prompt Title:</label>
            <input type="text" name="title" placeholder="e.g., Python For Loop"
                   th:value="${prompt != null ? prompt.title : ''}" required />
        </div>

        <div class="form-group">
            <label>The Prompt:</label>
            <textarea name="promptText" placeholder="Type your AI prompt here..." required
                      th:text="${prompt != null ? prompt.promptText : ''}"></textarea>
        </div>

        <div class="form-group">
            <label>Category:</label>
            <select name="categoryId" required>
                <option th:each="cat : ${categoriesList}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>

        <div class="form-group">
            <label>Visibility:</label>
            <select name="visibility">
                <option value="PRIVATE">Private (Only me)</option>
                <option value="SHARED">Shared (Everyone)</option>
            </select>
        </div>

        <button type="submit">Save to Vault</button>
    </form>
</div>
</body>
</html>
