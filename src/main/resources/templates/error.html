<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Something went wrong - PromptVault</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; color: #222; }
        .card { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 30px; max-width: 600px; margin: 60px auto; text-align: center; }
        h1 { color: #dc3545; }
        p { color: #555; }
        a.btn { display: inline-block; margin-top: 15px; padding: 10px 20px; border-radius: 4px; text-decoration: none; color: white; background-color: #007bff; }
    </style>
</head>
<body>
<!-- PVAULT-P2-04 (A02/A10): generic error page. No stack traces, exception
     messages, SQL or framework internals are ever rendered here. -->
<div class="card">
    <h1 th:text="${errorTitle != null ? errorTitle : 'Something went wrong'}">Something went wrong</h1>
    <p th:text="${errorMessage != null ? errorMessage : 'An unexpected problem occurred while processing your request. Please try again.'}">
        An unexpected problem occurred while processing your request. Please try again.
    </p>
    <a class="btn" href="/dashboard">Back to Dashboard</a>
</div>
</body>
</html>
