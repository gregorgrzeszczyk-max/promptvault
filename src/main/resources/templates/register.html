<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register for PromptVault</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
        .register-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div class="register-container">
    <h2 style="text-align: center; margin-top: 0;">Create an Account</h2>
    <div th:if="${error}" style="color:#721c24; background:#f8d7da; padding:10px; border-radius:4px; margin-bottom:15px;" th:text="${error}"></div>
    <form th:action="@{/register}" method="post">
        <div class="form-group"><label>First Name</label><input type="text" name="firstName" th:value="${registrationForm != null ? registrationForm.firstName : ''}" required /></div>
        <div class="form-group"><label>Last Name</label><input type="text" name="lastName" th:value="${registrationForm != null ? registrationForm.lastName : ''}" required /></div>
        <div class="form-group"><label>Username</label><input type="text" name="username" th:value="${registrationForm != null ? registrationForm.username : ''}" required /></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" th:value="${registrationForm != null ? registrationForm.email : ''}" required /></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required /><small style="color:#666;">8&ndash;128 characters, with at least one letter and one digit.</small></div>
        <button type="submit">Sign Up</button>
    </form>
    <a href="/login" style="display: block; text-align: center; margin-top: 15px; color: #007bff;">Back to Login</a>
</div>
</body>
</html>
