<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${prompt.title} + ' - PromptVault'">Prompt</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; color: #222; }
        .card { background: white; border: 1px solid #ddd; border-radius: 6px; padding: 20px; max-width: 800px; }
        .label { font-weight: bold; color: #555; margin-top: 12px; }
        .text-box { white-space: pre-wrap; background: #f8f9fa; border: 1px solid #eee; border-radius: 4px; padding: 12px; margin-top: 4px; }
        .tag { padding: 2px 8px; border-radius: 10px; font-size: 12px; color: white; }
        .tag-private { background-color: #6c757d; }
        .tag-shared { background-color: #17a2b8; }
        .tag-flagged { background-color: #dc3545; }
        .tag-clean { background-color: #28a745; }
        .alert-warning { background-color: #f8d7da; color: #721c24; padding: 14px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; max-width: 800px; }
        .alert-success { background-color: #d4edda; color: #155724; padding: 14px; border-radius: 4px; margin-bottom: 15px; max-width: 800px; }
        button { padding: 9px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        a.btn { display: inline-block; padding: 9px 16px; border-radius: 4px; text-decoration: none; color: white; }
    </style>
</head>
<body>
<h1>Prompt Details</h1>
<p><a href="/dashboard">Back to Dashboard</a></p>

<div th:if="${warningMessage}" class="alert-warning" th:text="${warningMessage}"></div>
<div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

<div class="card">
    <div class="label">Title</div>
    <div th:text="${prompt.title}">Title</div>

    <div class="label">Category</div>
    <div th:text="${prompt.category != null ? prompt.category.name : 'None'}">Category</div>

    <div class="label">Visibility</div>
    <div>
        <span th:if="${prompt.visibility == 'SHARED'}" class="tag tag-shared">Shared</span>
        <span th:unless="${prompt.visibility == 'SHARED'}" class="tag tag-private">Private</span>
    </div>

    <div class="label">Status</div>
    <div>
        <span th:if="${prompt.isFlagged()}" class="tag tag-flagged"
              th:text="'Flagged: ' + ${prompt.flaggedKeyword}">Flagged</span>
        <span th:unless="${prompt.isFlagged()}" class="tag tag-clean">Clean</span>
    </div>

    <div class="label">Prompt Text</div>
    <div class="text-box" th:text="${prompt.promptText}">Prompt text</div>

    <div class="label">Latest Simulated AI Response</div>
    <div class="text-box" th:text="${prompt.aiResponse != null ? prompt.aiResponse : 'Not submitted to the AI assistant yet.'}">Response</div>

    <div style="margin-top: 20px; display: flex; gap: 10px; align-items: center;">
        <form th:action="@{/user/prompts/submit}" method="post" style="margin:0;">
            <input type="hidden" name="id" th:value="${prompt.id}" />
            <button type="submit">Submit to AI Assistant</button>
        </form>
        <a class="btn" style="background-color:#ffc107; color:black;" th:href="@{/user/prompts/edit(id=${prompt.id})}">Edit</a>
    </div>
</div>
</body>
</html>
