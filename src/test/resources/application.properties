# ============================================
# Test configuration: in-memory H2 database
# Lets the Spring context load and tests run
# without a running MySQL server.
# ============================================

spring.datasource.url=jdbc:h2:mem:promptvault_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

logging.level.com.promptvault=INFO
logging.level.org.springframework.security=WARN
